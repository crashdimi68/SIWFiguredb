spring.application.name=figuredb-sempl


spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver
# Prima del primo avvio creare in pgAdmin il database vuoto "figuredb_sempl"
spring.datasource.url=jdbc:postgresql://localhost:5432/figuredb_sempl
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

# Open Session in View: la sessione Hibernate resta aperta fino al rendering del
# template, quindi le viste possono navigare le associazioni LAZY (es. ${s.figure.size()}).
spring.jpa.open-in-view=true

# data.sql viene eseguito a ogni avvio, dopo che Hibernate ha creato le tabelle.
# Gli INSERT sono idempotenti (WHERE NOT EXISTS), quindi non duplicano nulla.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
logging.level.org.hibernate.SQL=debug

logging.level.org.hibernate.stat=debug
spring.jpa.properties.hibernate.generate_statistics=true


# Porta diversa dal progetto originale, cosi' possono girare insieme
server.port=8081


spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=message
spring.messages.encoding=UTF-8
