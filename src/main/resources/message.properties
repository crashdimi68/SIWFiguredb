# Messaggi di validazione (Bean Validation via Spring MessageSource).
#
# NOTA IMPORTANTE: Spring MessageSource usa java.text.MessageFormat, che accetta
# SOLO placeholder numerici {0}, {1}, {2}. NON supporta {min}, {max} (che sono
# invece placeholder di Bean Validation puro). Per semplicita', qui scriviamo
# direttamente i numeri nei messaggi: sono valori stabili nelle annotation.

# --- Messaggi generici (applicati a tutti i campi) ---
NotBlank=Campo obbligatorio
NotNull=Campo obbligatorio
Email=Formato email non valido
Past=La data deve essere nel passato
Pattern=Formato non valido
Positive=Deve essere un numero maggiore di zero
PositiveOrZero=Non puo' essere negativo
typeMismatch=Formato non valido
typeMismatch.java.lang.Integer=Deve essere un numero intero
typeMismatch.java.lang.Float=Deve essere un numero

# --- Credentials ---
Size.credentials.username=Lo username deve essere compreso tra 3 e 30 caratteri
NotBlank.credentials.username=Lo username e' obbligatorio
NotBlank.credentials.password=La password e' obbligatoria
Size.credentials.password=La password deve avere almeno 3 caratteri

# --- User ---
NotBlank.credentials.user.nome=Il nome e' obbligatorio
NotBlank.credentials.user.cognome=Il cognome e' obbligatorio
NotBlank.credentials.user.email=L'email e' obbligatoria
Email.credentials.user.email=Formato email non valido

# --- Figure ---
NotBlank.figureForm.nome=Il nome della figure e' obbligatorio
Positive.figureForm.altezza=L'altezza deve essere maggiore di zero
Positive.figureForm.prezzo=Il prezzo deve essere maggiore di zero

# --- Fumetto ---
Pattern.fumettoForm.isbn=ISBN non valido: 10 o 13 cifre (l'ultima puo' essere X)
Min.fumettoForm.anno=L'anno deve essere almeno 1900
Max.fumettoForm.anno=L'anno non puo' superare il 2100

