<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureDB - Aziende</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="page-header">
            <h1>Tutte le Aziende</h1>
            <p class="page-subtitle">Le aziende produttrici delle figure</p>
        </div>

        <div th:if="${aziende.isEmpty()}" class="empty-state">
            <p>Non ci sono aziende registrate.</p>
        </div>

        <div th:unless="${aziende.isEmpty()}" class="card-grid">
            <a th:each="a : ${aziende}" th:href="@{'/aziende/' + ${a.id}}" class="card">
                <h3 th:text="${a.nome}">Azienda</h3>
                <span class="card-meta" th:text="${a.regione}">Regione</span>
            </a>
        </div>

        <div class="page-actions" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/aziende/new}" class="btn btn-primary">Nuova Azienda</a>
        </div>
    </section>
</body>
</html>
