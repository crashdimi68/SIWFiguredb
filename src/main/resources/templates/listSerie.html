<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureDB - Serie</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="page-header">
            <h1>Tutte le Serie</h1>
            <p class="page-subtitle">Le serie da cui provengono figure e fumetti del catalogo</p>
        </div>

        <div th:if="${serieList.isEmpty()}" class="empty-state">
            <p>Nessuna serie trovata.</p>
        </div>

        <div th:unless="${serieList.isEmpty()}" class="card-grid">
            <a th:each="s : ${serieList}" th:href="@{'/serie/' + ${s.id}}" class="card">
                <h3 th:text="${s.nome}">Nome serie</h3>
                <span class="card-meta" th:text="${s.tipo != null ? s.tipo.label : ''}">Tipo</span>
            </a>
        </div>

        <div class="page-actions" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/serie/new}" class="btn btn-primary">Nuova Serie</a>
        </div>
    </section>
</body>
</html>
