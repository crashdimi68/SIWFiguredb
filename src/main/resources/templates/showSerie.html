<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureDB - Dettaglio Serie</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content" th:if="${serie}">
        <div class="detail-card">
            <div class="detail-header">
                <img th:if="${serie.logo != null}" th:src="@{${serie.logo}}" th:alt="${serie.nome}" class="detail-img" />
                <h1 th:text="${serie.nome}">Nome serie</h1>
                <span class="detail-badge" th:if="${serie.tipo != null}" th:text="${serie.tipo.label}">Anime</span>
            </div>

            <div class="detail-body">
                <div class="detail-field" th:if="${serie.descrizione != null}">
                    <span class="detail-label">Descrizione</span>
                    <p th:text="${serie.descrizione}">Descrizione</p>
                </div>

                <div class="detail-field">
                    <span class="detail-label" th:text="'Personaggi (' + ${serie.personaggi.size()} + ')'">Personaggi</span>
                    <ul th:if="${!serie.personaggi.isEmpty()}" class="detail-list">
                        <li th:each="p : ${serie.personaggi}">
                            <strong th:text="${p.nome}">Nome</strong>
                            <span th:if="${p.descrizione != null}" th:text="' - ' + ${p.descrizione}"></span>
                        </li>
                    </ul>
                    <p th:if="${serie.personaggi.isEmpty()}" class="empty-text">Nessun personaggio registrato.</p>

                    <form sec:authorize="hasRole('ADMIN')" th:action="@{'/admin/serie/' + ${serie.id} + '/personaggi'}"
                          method="POST" class="inline-form">
                        <input type="text" name="nome" placeholder="Nome personaggio" required />
                        <input type="text" name="descrizione" placeholder="Descrizione (facoltativa)" />
                        <button type="submit" class="btn-small">Aggiungi personaggio</button>
                    </form>
                </div>

                <div class="detail-field">
                    <span class="detail-label" th:text="'Fumetti (' + ${fumetti.size()} + ')'">Fumetti</span>
                    <table th:if="${!fumetti.isEmpty()}" class="data-table">
                        <thead>
                            <tr><th>Titolo</th><th>Anno</th><th>Variant</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="fu : ${fumetti}">
                                <td><a th:href="@{'/fumetti/' + ${fu.id}}" th:text="${fu.titolo}">Titolo</a></td>
                                <td th:text="${fu.anno}">2020</td>
                                <td th:text="${fu.variant} ? 'Si' : 'No'">No</td>
                            </tr>
                        </tbody>
                    </table>
                    <p th:if="${fumetti.isEmpty()}" class="empty-text">Nessun fumetto per questa serie.</p>
                </div>

                <div class="detail-field">
                    <span class="detail-label" th:text="'Figure (' + ${figure.size()} + ')'">Figure</span>
                    <div th:if="${!figure.isEmpty()}" class="card-grid">
                        <a th:each="f : ${figure}" th:href="@{'/figure/' + ${f.id}}" class="card card-img">
                            <img th:if="${f.immagine != null}" th:src="@{${f.immagine}}" th:alt="${f.nome}" class="card-cover" />
                            <h3 th:text="${f.nome}">Figure</h3>
                            <span class="card-meta" th:text="${f.azienda.nome}">Azienda</span>
                        </a>
                    </div>
                    <p th:if="${figure.isEmpty()}" class="empty-text">Nessuna figure per questa serie.</p>
                </div>
            </div>

            <div class="detail-actions">
                <a th:href="@{/serie}" class="btn btn-secondary">&larr; Torna alle Serie</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{'/admin/serie/' + ${serie.id} + '/edit'}" class="btn btn-secondary">Modifica</a>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{'/admin/serie/' + ${serie.id} + '/delete'}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Eliminare questa serie?')">Elimina Serie</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
