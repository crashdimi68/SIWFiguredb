<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureDB - Scrittore</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="form-container">
            <h2 th:text="${scrittore.id != null ? 'Modifica Scrittore' : 'Nuovo Scrittore'}">Scrittore</h2>

            <form th:action="${scrittore.id != null ? '/admin/scrittori/' + scrittore.id + '/edit' : '/admin/scrittori'}"
                  method="POST" th:object="${scrittore}">

                <label for="nome">Nome</label>
                <input required type="text" id="nome" th:field="*{nome}" />
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-msg"></span>

                <label for="cognome">Cognome</label>
                <input required type="text" id="cognome" th:field="*{cognome}" />
                <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" class="error-msg"></span>

                <label for="dataNascita">Data di nascita</label>
                <input type="date" id="dataNascita" th:field="*{dataNascita}" />
                <span th:if="${#fields.hasErrors('dataNascita')}" th:errors="*{dataNascita}" class="error-msg"></span>

                <label for="paese">Paese</label>
                <input required type="text" id="paese" th:field="*{paese}" />
                <span th:if="${#fields.hasErrors('paese')}" th:errors="*{paese}" class="error-msg"></span>

                <button type="submit">Conferma</button>
            </form>
        </div>
    </section>
</body>
</html>
