<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureDB - Serie</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="form-container">
            <h2 th:text="${serie.id != null ? 'Modifica Serie' : 'Nuova Serie'}">Serie</h2>

            <p th:if="${errore}" class="error-msg" th:text="${errore}">Errore</p>

            <form th:action="${serie.id != null ? '/admin/serie/' + serie.id + '/edit' : '/admin/serie'}"
                  method="POST" th:object="${serie}">

                <label for="nome">Nome</label>
                <input required type="text" id="nome" th:field="*{nome}" placeholder="Nome della serie" />
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-msg"></span>

                <label for="tipo">Tipo</label>
                <select id="tipo" th:field="*{tipo}" required>
                    <option value="">-- Seleziona Tipo --</option>
                    <option th:each="t : ${tipi}" th:value="${t}" th:text="${t.label}">Tipo</option>
                </select>
                <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="error-msg"></span>

                <label for="logo">Logo (percorso o URL)</label>
                <input type="text" id="logo" th:field="*{logo}" />

                <label for="descrizione">Descrizione</label>
                <textarea id="descrizione" th:field="*{descrizione}" rows="4"></textarea>
                <span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}" class="error-msg"></span>

                <button type="submit">Conferma</button>
            </form>
        </div>
    </section>
</body>
</html>
