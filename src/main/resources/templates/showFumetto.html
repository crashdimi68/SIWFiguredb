<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureDB - Dettaglio Fumetto</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content" th:if="${fumetto}">
        <div class="detail-card">
            <div class="detail-header">
                <img th:if="${fumetto.immagine != null}" th:src="@{${fumetto.immagine}}" th:alt="${fumetto.titolo}" class="detail-img" />
                <h1 th:text="${fumetto.titolo}">Titolo</h1>
                <span class="detail-badge" th:if="${fumetto.variant}">Variant</span>
            </div>

            <div class="detail-body">
                <div class="detail-field">
                    <span class="detail-label">Serie</span>
                    <p th:text="${fumetto.serie.nome}">Serie</p>
                </div>

                <div class="detail-field">
                    <span class="detail-label">Scrittore</span>
                    <p th:text="${fumetto.scrittore.nomeCompleto}">Scrittore</p>
                </div>

                <div class="detail-field">
                    <span class="detail-label" th:text="'Disegnatori (' + ${fumetto.disegnatori.size()} + ')'">Disegnatori</span>
                    <ul class="detail-list">
                        <li th:each="d : ${fumetto.disegnatori}">
                            <p th:text="${d.nomeCompleto}">Disegnatore</p>
                        </li>
                    </ul>
                </div>

                <div class="detail-field">
                    <span class="detail-label">Editore</span>
                    <p><a th:href="@{'/editori/' + ${fumetto.editore.id}}" th:text="${fumetto.editore.nome}">Editore</a></p>
                </div>

                <div class="detail-field">
                    <span class="detail-label">Anno</span>
                    <p th:text="${fumetto.anno}">2020</p>
                </div>

                <div class="detail-field" th:if="${fumetto.genere != null}">
                    <span class="detail-label">Genere</span>
                    <p th:text="${fumetto.genere}">Genere</p>
                </div>

                <div class="detail-field">
                    <span class="detail-label">ISBN</span>
                    <p th:text="${fumetto.isbn}">ISBN</p>
                </div>

                <div class="detail-field" th:if="${fumetto.prezzo != null}">
                    <span class="detail-label">Prezzo</span>
                    <p th:text="${#numbers.formatDecimal(fumetto.prezzo, 1, 2)} + ' EUR'">5 EUR</p>
                </div>
            </div>

            <div class="detail-actions">
                <a th:href="@{/fumetti}" class="btn btn-secondary">&larr; Torna ai Fumetti</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{'/admin/fumetti/' + ${fumetto.id} + '/edit'}" class="btn btn-secondary">Modifica</a>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{'/admin/fumetti/' + ${fumetto.id} + '/delete'}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Eliminare questo fumetto?')">Elimina Fumetto</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
