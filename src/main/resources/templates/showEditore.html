<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureDB - Dettaglio Editore</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content" th:if="${editore}">
        <div class="detail-card">
            <div class="detail-header">
                <img th:if="${editore.logo != null}" th:src="@{${editore.logo}}" th:alt="${editore.nome}" class="detail-img" />
                <h1 th:text="${editore.nome}">Editore</h1>
                <span class="detail-badge" th:if="${editore.regione != null}" th:text="${editore.regione}">Italia</span>
            </div>

            <div class="detail-body">
                <div class="detail-field" th:if="${editore.descrizione != null}">
                    <span class="detail-label">Descrizione</span>
                    <p th:text="${editore.descrizione}">Descrizione</p>
                </div>

                <div class="detail-field">
                    <span class="detail-label" th:text="'Fumetti pubblicati (' + ${editore.fumetti.size()} + ')'">Fumetti</span>
                    <ul th:if="${!editore.fumetti.isEmpty()}" class="detail-list">
                        <li th:each="fu : ${editore.fumetti}">
                            <a th:href="@{'/fumetti/' + ${fu.id}}" th:text="${fu.titolo} + ' (' + ${fu.anno} + ')'">Fumetto</a>
                        </li>
                    </ul>
                    <p th:if="${editore.fumetti.isEmpty()}" class="empty-text">Nessun fumetto pubblicato.</p>
                </div>
            </div>

            <div class="detail-actions">
                <a th:href="@{/fumetti}" class="btn btn-secondary">&larr; Torna ai Fumetti</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{'/admin/editori/' + ${editore.id} + '/edit'}" class="btn btn-secondary">Modifica</a>
            </div>
        </div>
    </section>
</body>
</html>
